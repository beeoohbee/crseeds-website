- q: Is there more value beyond just buying a bag of seed from you?
  a: Yes. Ask when next educational opportunities are. Ask me how can help provide items for farm and family within seed purchase. Ask about trip qualifications.
- q: Can you help interpret past soil reports?
  a: Yes, however; it depends how long ago they were taken whether relevant for decision making. CR will likely offer a different perspective on what correlates to yield when analyzing new soil and overlayed harvest data.
- q: Is there a grain bagger and unloader at your site to rent?
  a: No, not at this point in time. However, we have access to track one potentially down for you.
- q: Are there any incentives for products or services during the summer?
  a: Yes. Grain bags, soil sampling and seed.
- q: Are you able to provide guidance in changing to a liquid fertility program?
  a: Yes. From the WHY to the IMPLEMENTATION. From my personal and local knowledge to professors and widespread Farmer experiences.
- q: Any custom planting, application, harvest or trucking provided?
  a: No, not at the this point in time. However, likely can offer multiple contacts to help.
