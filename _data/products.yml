- title: Livestock Supplements & Supplies
  image: Cory-Livestock-1024x789.jpeg
  text: We offer a full range of livestock supplements, from bagged minerals to one-ton protein blocks. We also supply bedding products and hay bale wrap to support the health and management of your operation.
- title: Grain Bagging
  image: grain-bagging-1024x576.jpeg
  text: We provide high-quality storage bags for grain, available in multiple sizes to meet your operation’s needs. We can also assist in sourcing grain bag loaders and unloaders, with options to rent or purchase.
- title: Soil Sampling
  image: Corysoildsmapling-1024x901.png
  text: We offer a complete analysis of your fields via Ag Spectrum. We help decide management zones and provide VRx for P, K and Lime. We provide a discussion catered to your operation that will likely be a different experience compared to most other providers.
- title: Indigo Inoculants
  image: Cory-Indigo-pic-1024x749.jpeg
  text: We offer Indigo inoculants—dry seed additives designed for use with beans and corn to support healthy crop development.
