<footer class="site-footer">
  <div class="container footer-grid">
    <a class="footer-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/Green_crc_seeds_logo.jpeg' | relative_url }}" alt="{{ site.title }}">
    </a>
    <div>
      <h2>Quick Links</h2>
      <ul>
        {% for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </div>
    <div>
      <h2>Contact Info</h2>
      <ul>
        <li><a href="tel:{{ site.phone_link }}">{{ site.phone }}</a></li>
        <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
        <li>{{ site.address_line1 }}<br>{{ site.address_line2 }}</li>
      </ul>
    </div>
  </div>
  <p class="footer-tagline">{{ site.description | strip }}</p>
  <div class="footer-bottom">© {{ 'now' | date: '%Y' }} {{ site.title }}</div>
</footer>
